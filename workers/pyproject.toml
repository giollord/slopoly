[project]
name = "slopoly-worker"
version = "0.1.0"
description = "Shared RabbitMQ job worker for Slopoly's containers"
requires-python = ">=3.11"
dependencies = ["aio-pika>=10.2,<11", "httpx>=0.28,<1", "pydantic>=2.14,<3"]

[project.optional-dependencies]
test = ["pytest>=9.2", "pytest-asyncio>=1.5", "respx>=0.23"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slopoly_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
