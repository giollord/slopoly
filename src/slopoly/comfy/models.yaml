# Models the shipped workflows need. All are free to download (no sign-in) and allow commercial use of their outputs.
# `slopoly doctor` checks them against your ComfyUI; `slopoly doctor --fetch` downloads missing ones into
# <models-dir>/<subfolder>/<file> when comfyui.models_dir is configured.
